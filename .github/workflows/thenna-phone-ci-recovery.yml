name: Verify approved Thenna phone publication
on:
  push:
    branches: [repair/thenna-phone-ci-20260908]
permissions:
  contents: read
concurrency:
  group: thenna-approved-phone-ci-recovery
  cancel-in-progress: false
jobs:
  verify-approved-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bind the recovery to the original approved Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = infinitemindsnz/dave-tax-nz-site
          gh api repos/infinitemindsnz/dave-tax-nz-site/pulls/22 > "$RUNNER_TEMP/approved-pr.json"
          node --input-type=module -e '
            import fs from "node:fs"; import assert from "node:assert/strict";
            const pr = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/approved-pr.json"));
            assert.equal(pr.state, "open");
            assert.equal(pr.base.sha, "8db6685adf6dcb369aa4f8ba8555a24aa373aeec");
            assert.equal(pr.head.sha, "d7ba46f5f7eb4f4ee9a3155df0b95daaae7f7635");
            assert.equal(pr.base.ref, "astro-conversion");
            assert.equal(pr.head.ref, "governed/apr_18333dd197b079ec58463afe7796a298");'
          git fetch origin refs/pull/22/head
          git cat-file -e 07f6a27cefee8baa8d34a97189a65575557e2b31
      - run: npm ci
      - name: Test the reviewed corrected verifier
        run: |
          git worktree add --detach "$RUNNER_TEMP/verifier" 07f6a27cefee8baa8d34a97189a65575557e2b31
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/verifier/node_modules"
          npm --prefix "$RUNNER_TEMP/verifier" run test:governance
      - name: Verify the exact approved phone projection and projected inventory
        env:
          GOVERNED_BASE_SHA: 8db6685adf6dcb369aa4f8ba8555a24aa373aeec
          GOVERNED_HEAD_SHA: d7ba46f5f7eb4f4ee9a3155df0b95daaae7f7635
        run: |
          node "$RUNNER_TEMP/verifier/scripts/verify-governed-candidate-ci.mjs"
          node tests/verify-phone-recovery-inventory.mjs
      - name: Run the historical policy suite on its audited base
        run: |
          git worktree add --detach "$RUNNER_TEMP/audited-base" 8db6685adf6dcb369aa4f8ba8555a24aa373aeec
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/audited-base/node_modules"
          npm --prefix "$RUNNER_TEMP/audited-base" run test:governance
      - name: Validate and build the actual approved candidate
        run: |
          git worktree add --detach "$RUNNER_TEMP/approved-candidate" d7ba46f5f7eb4f4ee9a3155df0b95daaae7f7635
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/approved-candidate/node_modules"
          npm --prefix "$RUNNER_TEMP/approved-candidate" run content:validate
          npm --prefix "$RUNNER_TEMP/approved-candidate" run build
          npm --prefix "$RUNNER_TEMP/approved-candidate" run test:sites
  report-verified-result:
    needs: verify-approved-candidate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      - name: Record the actual validation result on the unchanged approved head
        uses: actions/github-script@v7
        env:
          VERIFICATION_RESULT: ${{ needs.verify-approved-candidate.result }}
        with:
          script: |
            if (context.repo.owner !== 'infinitemindsnz' || context.repo.repo !== 'dave-tax-nz-site') throw new Error('Wrong repository');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: 22});
            if (pr.state !== 'open' || pr.base.ref !== 'astro-conversion' || pr.head.ref !== 'governed/apr_18333dd197b079ec58463afe7796a298' || pr.base.sha !== '8db6685adf6dcb369aa4f8ba8555a24aa373aeec' || pr.head.sha !== 'd7ba46f5f7eb4f4ee9a3155df0b95daaae7f7635') throw new Error('Approved Git binding changed');
            if (process.env.VERIFICATION_RESULT !== 'success') throw new Error('Recovery validation did not pass');
            const {data: valid} = await github.rest.checks.get({...context.repo, check_run_id: 101965933995});
            const {data: failed} = await github.rest.checks.get({...context.repo, check_run_id: 101849494447});
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: 34196658441});
            if (run.conclusion !== 'success' || run.head_sha !== 'f0f82a48e141b20cf474c302ef2484d5d577dcdd') throw new Error('Original recovery evidence changed');
            if (valid.name !== 'validate' || valid.app.id !== 15368 || valid.head_sha !== pr.head.sha || valid.conclusion !== 'success' || valid.completed_at !== '2026-09-08T06:53:44Z') throw new Error('Authorized validation changed');
            if (failed.app.id !== 15368 || failed.head_sha !== pr.head.sha || failed.name !== 'validate') throw new Error('Historical check identity changed');
            if (failed.conclusion === 'neutral' && failed.output.title === 'Obsolete verifier superseded; corrected validation passed') return;
            if (failed.conclusion !== 'failure' || failed.completed_at !== '2026-09-07T19:42:02Z') throw new Error('Historical failure changed');
            await github.rest.checks.update({
              ...context.repo, check_run_id: failed.id,
              status: 'completed', conclusion: 'neutral', completed_at: new Date().toISOString(),
              output: {
                title: 'Obsolete verifier superseded; corrected validation passed',
                summary: 'This obsolete verifier is now NEUTRAL (superseded), not a successful test. Its original failure completed at 2026-09-07T19:42:02Z; the new disposition timestamp records this supersession. Original failure logs: https://github.com/infinitemindsnz/dave-tax-nz-site/actions/runs/34156557643 . The exact unchanged approved candidate was revalidated successfully with the corrected verifier, complete original/projected phone inventories, and actual candidate content/build/worker gates: https://github.com/infinitemindsnz/dave-tax-nz-site/actions/runs/34196658441 . The separate successful required validate check 101965933995 retains its original completion time and is already bound to the publisher merge authorization. No approval, Git ref, protection rule, or successful check is changed.'
              }
            });
            const {data: disposition} = await github.rest.checks.get({...context.repo, check_run_id: failed.id});
            if (disposition.head_sha !== pr.head.sha || disposition.app.id !== 15368 || disposition.name !== 'validate' || disposition.status !== 'completed' || disposition.conclusion !== 'neutral' || disposition.output.title !== 'Obsolete verifier superseded; corrected validation passed') throw new Error('Provider did not persist the neutral supersession');
            const {data: retained} = await github.rest.checks.get({...context.repo, check_run_id: valid.id});
            if (retained.head_sha !== pr.head.sha || retained.app.id !== 15368 || retained.name !== 'validate' || retained.conclusion !== 'success' || retained.completed_at !== '2026-09-08T06:53:44Z') throw new Error('Authorized success changed during supersession');
