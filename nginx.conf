server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same SPA behaviour as the repo's Cloudflare worker: any non-asset 404 that
  # wants HTML falls back to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed Vite bundles are content-addressed and safe to cache hard.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The shell itself must never be cached, so a rebuild is picked up at once.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;
}
