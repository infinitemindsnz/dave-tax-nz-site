        Dave Ananth is a Partner at Meridian Partners and the Honorary Consul of Timor-Leste in Auckland, with over 35 years of legal practice in New Zealand and internationally. As a former Solicitor and Prosecutor for the Inland Revenue Department, he is widely recognized for his expertise in tax compliance and regulatory disputes, particularly where government enforcement intersects with individual and small business obligations.

        Dave specializes in navigating complex, high-stakes student loan disputes in NZ and Inland Revenue negotiations. His practice focuses on resolving extreme, multi-decade debt cycles—including severe cases where an overseas-based borrower’s student loan has ballooned up to $500,000 due to compounding interest and penalties. Across every case, his primary focus is achieving practical, lawful outcomes while reducing unnecessary cost, escalation, and enforcement risk.

        By serving as a complete strategic buffer, Dave halts aggressive IRD enforcement, cascading interest, and active NZ border-arrest risks. Drawing on firsthand insight into how the department operates, he secures rapid breakthroughs, penalty relief, and manageable student loan repayment packages—often within 24 to 72 hours.

        A trusted authority on New Zealand tax law, Dave is a regular media contributor on IRD tax debt and recovery practices, with recent expert commentary published on Interest.co.nz.
