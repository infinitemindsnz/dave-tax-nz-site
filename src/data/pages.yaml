# Governed page-copy model for the Dave Ananth tax barrister site.
#
# One entry per WordPress page from davetaxnz.nz, keyed by its WordPress slug.
# Copy is migrated VERBATIM from the WordPress REST payload
# (/wp-json/wp/v2/pages) with HTML entities decoded and Elementor wrapper markup
# stripped. Nothing here is rewritten, summarised or "improved" — every string
# is the client's own words and any edit is a visible content change.
#
# `title` is the WordPress page title. `description` is the WordPress excerpt
# rendered to plain text. WordPress auto-generates these by truncating the page,
# so most of them end in the literal "[…]" marker WordPress emits and some are
# stale relative to the live page body. That is upstream data, preserved as-is.
#
# Each section is one of four kinds:
#   prose  — heading and/or body paragraphs (blank-line separated)
#   list   — heading (optional) plus items[]
#   quote  — a pull quote or testimonial; heading = attributed name,
#            meta = the secondary attribution line (e.g. the month/year)
#   cta    — a call to action; body = the link label, href = the target
#
# Validated at build time by src/data/schema.ts (strict: unknown keys throw).
# Run `npm run content:validate` after any edit.

