        When the IRD starts asking questions or issuing penalties, most people quickly feel overwhelmed. One letter becomes three, penalties compound, cashflow tightens, and suddenly everything feels urgent.

        I’m Dave Ananth, a tax barrister, Partner at Meridian Partners, and former IRD prosecutor with over 35 years’ experience in tax disputes, negotiations, and complex arrears matters. I don’t argue for the sake of arguing — I negotiate, find workable solutions, and help you put the issue behind you so you can move forward with certainty rather than stress.

        My commentary on IRD enforcement is regularly featured on RNZ, NZ Herald, The Post, Otago Daily Times, and Newstalk ZB, and I’m known for presenting cases in a way the IRD actually listens to.

        If the IRD is contacting you, the worst thing you can do is ignore it.
        Talk to me — and let me deal with the IRD.
