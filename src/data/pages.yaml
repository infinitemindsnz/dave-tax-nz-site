    - kind: "prose"
      heading: "Outcome-Focused"
      body: "Clients come to me because they want practical, real-life results — not jargon or theory."
    - kind: "prose"
      heading: "Discreet & Non-Judgmental"
      body: |-
        Tax issues happen for all sorts of reasons. I focus on helping you solve the problem, quietly and professionally.

        When you’re dealing with IRD, experience matters more than anything.
    - kind: "prose"
      heading: "IRD Penalties & Interest — What Most People Don’t Realise"
      body: |-
        IRD penalties are automatic.
        Penalty removal is not.

        Most clients are surprised to learn:
    - kind: "list"
      items:
        - "penalties can be reduced or removed"
        - "interest can be mitigated"
        - "genuine hardship changes IRD’s approach"
        - "payment arrangements stop enforcement"
        - "IRD considers context when it’s properly presented"
        - "early intervention always produces better results"
    - kind: "prose"
      body: |-
        This is why strategic negotiation matters.

        You don’t have to accept IRD’s position — and you don’t need to be intimidated by the system.
    - kind: "cta"
      body: "Contact Dave"
      href: "https://davetaxnz.nz/contact/"
    - kind: "prose"
      heading: "Frequently Asked Questions"
    - kind: "prose"
      heading: "I owe money to IRD and can’t pay. What should I do first?"
      body: "Contact me early. The sooner you act, the more options we have. Delay makes things worse."
    - kind: "prose"
      heading: "Can IRD remove penalties?"
      body: "Yes. Penalties can often be negotiated or remitted depending on your circumstances."
    - kind: "prose"
      heading: "Can you negotiate lower repayments?"
      body: "Yes. IRD will consider capacity-to-pay when properly demonstrated."
    - kind: "prose"
      heading: "What if I’ve ignored IRD letters?"
      body: "You’re not alone. Ignoring won’t make the problem disappear, but we can still get ahead of enforcement."
    - kind: "prose"
      heading: "Will IRD listen?"
      body: "Yes — when the case is presented strategically. This is where expertise and experience matter."
    - kind: "prose"
      heading: "Can all this be handled quietly?"
      body: "Yes. Everything is confidential and managed discreetly."
    - kind: "prose"
      heading: "Don't leave your IRD Debt unpaid any longer"
      body: |-
        If you’re facing IRD penalties, arrears, overdue returns, or growing pressure from collections, don’t wait until it escalates further.

        You don’t need to deal with IRD alone.
        You don’t need to feel embarrassed.
        You don’t need to lose sleep over this.

        Confidential, strategic, and results-driven negotiation — so you can put this chapter behind you and move on.
    - kind: "list"
      heading: "Contact Dave"
      items:
        - "Auckland Mobile: +64 (21) 021 68888"
        - "Email: dave@davetaxnz.nz"
        - "WhatsApp available"
    - kind: "cta"
      body: "BOOK A FREE CONSULTATION"
      href: "https://davetaxnz.nz/book-a-consultation/"

