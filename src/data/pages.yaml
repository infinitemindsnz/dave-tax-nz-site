student-loan-negotiations:
  title: "Student Loan Negotiations"
  description: "Student Loan Negotiations & IRD Help Student Loan Lawyer & IRD Negotiator If you’re living overseas, planning to return home, or feeling pressure from the IRD over unpaid student loans, you’re not alone — and you don’t need to face it alone. I’m Dave Ananth, a tax barrister, Partner at Meridian Partners, former IRD prosecutor, and […]"
  sections:
    - kind: "prose"
      heading: "Student Loan Negotiations & IRD Help"
    - kind: "prose"
      heading: "Student Loan Lawyer & IRD Negotiator"
      body: |-
        If you’re living overseas, planning to return home, or feeling pressure from the IRD over unpaid student loans, you’re not alone — and you don’t need to face it alone.

        I’m Dave Ananth, a tax barrister, Partner at Meridian Partners, former IRD prosecutor, and one of New Zealand’s leading authorities on student loan negotiations and enforcement.

        Each year, I assist overseas New Zealanders to:
    - kind: "list"
      items:
        - "reduce penalties"
        - "negotiate affordable repayment arrangements,"
        - "resolve decades-old arrears,"
        - "avoid enforcement action, and"
        - "return home without fear of arrest at the airport."
    - kind: "prose"
      body: "My work is regularly featured on RNZ, The Post, NZ Herald, Otago Daily Times, and Newstalk ZB, reflecting the scale and complexity of the student loan matters I handle."
    - kind: "prose"
      heading: "DAVE ANANTH"
      body: "Student Loan Lawyer And IRD Negotiation Specialist"
    - kind: "list"
      items:
        - "Auckland Mobile: +64 (21) 021 68888"
        - "Email: dave@davetaxnz.nz"
    - kind: "prose"
      heading: "The Problem Overseas Student Loan Holders Face"
      body: "New Zealand’s student loan system was built for local employment — not long-term migration. Overseas borrowers now face:"
    - kind: "list"
      items:
        - "rapidly escalating penalties"
        - "compounding interest"
        - "“default” status"
        - "threats of legal action"
        - "border arrest risk"
        - "pension deductions"
        - "aggressive collection tactics"
        - "confusing or inconsistent IRD communication"
        - "unexpected arrears after many years abroad"
    - kind: "prose"
      body: |-
        For many, the balance has doubled or tripled — and the idea of coming home feels unsafe or humiliating.

        But ignoring IRD won’t make it go away.
        Don’t bury your head in the sand.
        There are legal, practical, and realistic pathways to fix this.
    - kind: "prose"
      heading: "How I Help With Your Student Loan Penalties"
      body: "As a former IRD prosecutor and a specialist in tax negotiation, I bring a strategic, calm, and results-focused approach to resolving student loan issues."
    - kind: "prose"
      heading: "Penalty Negotiation & Reduction"
      body: "Removing or reducing late payment penalties and compounding interest."
    - kind: "prose"
      heading: "Affordable Settlement Arrangements"
      body: "Negotiated based on your real financial situation — not IRD’s assumptions."
    - kind: "prose"
      heading: "Safe Return to New Zealand"
      body: "Sorting arrears and enforcement before you travel, so you can fly without fear."
    - kind: "prose"
      heading: "Preventing Airport Arrests"
      body: "Managing your case so enforcement does not escalate to detention."
    - kind: "prose"
      heading: "Communicating with IRD For You"
      body: "I deal with IRD directly — you don’t have to."
    - kind: "prose"
      heading: "Humanising Your Case"
      body: "Your story matters. Family obligations, illness, income changes, hardship — the right presentation changes outcomes."
    - kind: "prose"
      heading: "Fixing Old or Forgotten Loans"
      body: |-
        Even if you left NZ decades ago, your situation can still be resolved.

        You don’t need to be embarrassed. You just need the right strategy.
    - kind: "prose"
      heading: "Why Choose Me"
    - kind: "prose"
      heading: "Former IRD Prosecutor"
      body: "I know exactly how IRD evaluates risk, penalties, hardship, and enforcement — from the inside."
    - kind: "prose"
      heading: "Recognised National Expert"
      body: "My commentary on student loans and IRD enforcement is regularly published in major media."
    - kind: "prose"
      heading: "35+ Years of Legal and Tax Experience"
      body: "I’ve negotiated some of New Zealand’s most difficult student loan cases."
    - kind: "prose"
      heading: "Confidential, Non-Judgmental Advice"
      body: "No lectures, no judgment — just practical help."
    - kind: "prose"
      heading: "Proven Results"
      body: |-
        I’ve helped many overseas New Zealanders come home peacefully and rebuild their lives.

        When you’re dealing with IRD, experience matters more than anything.
    - kind: "prose"
      heading: "If You’re Overseas and Worried About Your Student Loan Debt — Start Here"
      body: "If you are:"
    - kind: "list"
      items:
        - "worried about being arrested at the border,"
        - "overwhelmed by ballooning penalties,"
        - "ignoring IRD letters out of fear,"
        - "struggling to pay from overseas,"
        - "planning to return after many years abroad,"
        - "or dealing with aggressive collectors…"
    - kind: "prose"
      body: |-
        …then the worst thing you can do is nothing.

        Don’t bury your head in the sand.
        The earlier you act, the more options you have — and the easier the solution.
    - kind: "cta"
      body: "Contact Dave"
      href: "https://davetaxnz.nz/contact/"
    - kind: "prose"
      heading: "Frequently Asked Questions"
    - kind: "prose"
      heading: "I’m overseas and afraid of being arrested. Can you help?"
      body: "Yes. Arrests occur in limited circumstances. I can assess your risk immediately and negotiate protection before you enter New Zealand."
    - kind: "prose"
      heading: "My balance has exploded due to penalties. Is there any hope?"
      body: "Absolutely. Penalties and charges can often be reduced, depending on circumstances."
    - kind: "prose"
      heading: "I’ve ignored IRD for years. Am I in trouble?"
      body: "You’re not the first, and you won’t be the last. What matters is acting before enforcement escalates."
    - kind: "prose"
      heading: "Can everything be fixed while I’m overseas?"
      body: "In most cases, yes — without you needing to come to New Zealand."
    - kind: "prose"
      heading: "Will IRD listen?"
      body: "Yes — when approached strategically. As a former IRD prosecutor, I know how to present your case effectively."
    - kind: "prose"
      heading: "If I fix this, can I come home safely?"
      body: "In the majority of cases, yes. Once a plan or negotiation is in place, the risk drops significantly."
    - kind: "prose"
      heading: "Is this confidential?"
      body: "Always. Your situation is handled with discretion and respect."
    - kind: "prose"
      heading: "Don't leave your student loan unpaid any longer"
      body: |-
        You don’t need to face IRD alone.
        You don’t need to be embarrassed.
        And you don’t need to navigate this system by yourself.

        If you’re stressed about arrears, penalties, or returning home safely, reach out.
        I’m here to listen — and to help you fix this properly.
    - kind: "list"
      heading: "Contact Dave"
      items:
        - "Auckland Mobile: +64 (21) 021 68888"
        - "Email: dave@davetaxnz.nz"
        - "WhatsApp available"
    - kind: "cta"
      body: "BOOK A FREE CONSULTATION"
      href: "https://davetaxnz.nz/book-a-consultation/"

