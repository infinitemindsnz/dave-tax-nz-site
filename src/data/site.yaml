expertise:
  eyebrow: "Expertise"
  heading: "A direct route through difficult IRD matters."
  intro: "Dave works as a strategic buffer between you and Inland Revenue—assessing risk, preparing the case and leading negotiations."
  # Cards 01 and 02 pointed at davetaxnz.nz/student-loan-negotiations/ and
  # davetaxnz.nz/ird-disputes-tax-penalties-negotiation/ — the exact two
  # WordPress permalinks whose pages are now migrated into pages.yaml under the
  # SAME slugs and published at /student-loan-negotiations/ and
  # /ird-disputes-tax-penalties-negotiation/. The card now goes to the page in
  # this repo instead of bouncing the visitor back to the old site. Same
  # destination, same copy, one hop fewer; no link is invented.
  #
  # Card 03 is untouched. Its href is a mailto: the client chose, not a
  # placeholder, and there is no migrated "business tax matters" page to point
  # it at.
  items:
    - number: "01"
      icon: "Student"
      title: "Student loan negotiations"
      text: "Support for overseas borrowers facing compounding interest, penalties, enforcement or concerns about returning to New Zealand."
      href: "/student-loan-negotiations/"
      linkLabel: "Learn more"
    - number: "02"
      icon: "FileText"
      title: "IRD disputes & tax debt"
      text: "Strategic advice on tax arrears, investigations, statutory demands, payment arrangements, remission and enforcement action."
      href: "/ird-disputes-tax-penalties-negotiation/"
      linkLabel: "Learn more"
    - number: "03"
      icon: "Briefcase"
      title: "Business tax matters"
      text: "Practical, commercially aware advice for GST, PAYE, income tax, unfiled returns and business rehabilitation."
      href: "mailto:dave@davetaxnz.nz?subject=Business%20tax%20matter"
      linkLabel: "Learn more"

story:
  eyebrow: "Client story"
