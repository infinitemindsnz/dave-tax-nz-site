# Governed content model for the Dave Ananth tax barrister site.
#
# Every user-visible string on the page lives here. Components read this file
# through src/lib/content.ts and MUST NOT hardcode copy. Strings are copied
# verbatim from the pre-Astro React source (src/App.jsx) and index.html,
# including punctuation, en/em dashes and curly apostrophes. Do not "fix"
# typography or copy here — this file is the source of truth for the rendered
# page, and any edit is a visible content change.
#
# Validated at build time by src/data/schema.ts (strict: unknown keys throw).

meta:
  lang: "en"
  title: "Dave Ananth | Tax Barrister & IRD Negotiator"
  description: "Dave Ananth is a New Zealand tax barrister, former IRD prosecutor and specialist in student loan and Inland Revenue negotiations."
  themeColor: "#111315"

brand:
  name: "Dave Ananth"
  tagline: "Tax Barrister"
  href: "#top"
  ariaLabel: "Dave Ananth home"
  logo:
    src: "assets/dave-ananth-logo.webp"
    alt: "Dave Ananth, Tax Barrister"
    width: 150
    height: 130

nav:
  ariaLabel: "Primary navigation"
  skipLabel: "Skip to content"
  menuOpenLabel: "Open menu"
  menuCloseLabel: "Close menu"
  # LABELS ARE THE CLIENT'S AND ARE UNCHANGED. Only the targets moved.
  #
  # These were five same-page anchors, because the site was one page. Four of
  # the five now name a real route, because the WordPress page behind that label
  # has been migrated and is published:
  #
  #   About Dave      → /about-dave/     (pages.yaml `about-dave`)
  #   Client stories  → /testimonials/   (pages.yaml `testimonials`)
  #   Articles & media→ /articles/       (the article index, 18 posts)
  #   Contact         → /contact/        (pages.yaml `contact`)
  #
  # "Expertise" KEEPS its anchor: there is no migrated "expertise" page. The
  # homepage section is the only thing that label can mean, and inventing a
  # route for it would mean inventing a page. The two practice areas it covers
  # are reachable from the cards in that section.
  #
  # The homepage sections (#about, #stories, #insights, #contact) all still
  # exist and are still linked from within the page; nav is now wayfinding to
  # pages rather than scroll control.
  items:
    - label: "About Dave"
      href: "/about-dave/"
    - label: "Expertise"
      href: "#expertise"
    - label: "Client stories"
      href: "/testimonials/"
    - label: "Articles & media"
      href: "/articles/"
    - label: "Contact"
      href: "/contact/"
  # DELIBERATELY STILL EXTERNAL. `book-a-consultation` is migrated, but the
  # extractor could only carry its copy: the WordPress booking form survives in
  # pages.yaml as a `list` of field labels ("Name:", "Email:", …) and a `cta`
  # with no href. Pointing the site's primary conversion action at a page whose
  # form cannot submit would break the client's booking funnel. This stays on
  # the live WordPress form until a real form exists here.
  cta:
    label: "Book a free consultation"
    href: "https://davetaxnz.nz/book-a-consultation/"
    external: true

