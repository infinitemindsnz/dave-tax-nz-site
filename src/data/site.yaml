  body: "After decades of stress over an unresolved student loan, Dave handled the paperwork and IRD communication, helping the client reach a resolution within days."
  credit:
    name: "Jana R"
    meta: "Student loan client · June 2025"
  link:
    label: "Read client experiences"
    href: "https://davetaxnz.nz/testimonials/"

insights:
  eyebrow: "Latest thinking"
  heading: "Articles & media"
  intro: "Regularly updated guidance on IRD, tax and student loan issues—written by Dave or featuring his commentary."
  filtersLabel: "Filter articles"
  # The first entry is the default/"show everything" filter. "In the media"
  # filters on article.type !== "By Dave"; every other value matches
  # article.category exactly.
  filters:
    - "All"
    - "Student loans"
    - "IRD"
    - "Tax"
    - "In the media"
  articleLinkLabel: "Read article"

# Chrome for /articles/ and /articles/<slug>/. Four labels, nothing more: every
# other string on those pages is data (src/content/articles/*.md frontmatter and
# body, and the `articles-advice` record in pages.yaml).
#
# `attributionLabel` and `attributionLinkLabel` frame the source credit on a
# detail page. Many posts are reposts of Interest.co.nz, Stuff, RNZ, Newstalk ZB
# or Te Waha Nui reporting; that credit is legally load-bearing and is rendered
# above the body, never collapsed or hidden.
#
# `authoredLabel` is not new copy — "By Dave" is the value articles.yaml already
# uses in `type` for Dave's own pieces.
#
# `indexLinkLabel` is the label for ANY link to the article index: the back link
# on a detail page, and the section link at the foot of the homepage "Articles &
# media" grid. One destination, one wording — the homepage does not get a second
# phrase invented for the same link.
articlePages:
  indexLinkLabel: "All articles"
  authoredLabel: "By Dave"
  attributionLabel: "Originally published by"
  attributionLinkLabel: "Read the original"

contact:
  eyebrow: "Contact Dave"
  heading: "Take the first step before the matter escalates."
  intro: "Initial consultations are free and confidential. Tell Dave what has happened and he will explain the practical next step."
  rows:
    # KNOWN UPSTREAM DATA BUG — PRESERVED DELIBERATELY.
    # The displayed number has 12 digits after "+64 " grouping while the tel:
    # href has 11. src/App.jsx shipped phoneDisplay "+64 21 021 68888" against
    # phoneHref "tel:+64210216888". Do not reconcile without the client's
    # confirmation of the correct number.
    - label: "Call Dave directly"
      value: "+64 21 021 68888"
      href: "tel:+64210216888"
    - label: "Email Dave"
      value: "dave@davetaxnz.nz"
      href: "mailto:dave@davetaxnz.nz"
    - label: "Auckland office"
      value: "97 Great South Road, Epsom"
      href: "https://www.google.com/maps/search/?api=1&query=97+Great+South+Road+Epsom+Auckland+1051"
  action:
    title: "Free 15-minute initial consultation"
    ctaLabel: "Book a consultation"
    ctaHref: "https://davetaxnz.nz/book-a-consultation/"

