app = "dave-tax-nz-site"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Static assets only — no database, no poller, nothing to keep warm. Let the
  # machine stop when idle and cold-start on demand.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
